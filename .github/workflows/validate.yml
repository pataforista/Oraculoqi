name: Validar Integridad y Compilación

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar dataset (modo estricto, bloqueante)
        run: npm run validate

      - name: Reporte de curaduría editorial (informativo)
        run: node validate_dataset.cjs --json=reporte_curaduria.json --quiet || true

      - name: Subir reporte de curaduría
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-curaduria
          path: reporte_curaduria.json
          if-no-files-found: ignore

      - name: Verificar compilación en producción
        run: npm run build
