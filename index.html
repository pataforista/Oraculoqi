<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Trozos de Sabiduría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PWA de reflexión diaria con una carta de sabiduría, modo offline y guardado local de favoritas." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#121015">
  <link rel="apple-touch-icon" href="icons/enso-8bit.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="stylesheet" href="Galaxy.css">
  <link rel="stylesheet" href="ElectricBorder.css">
  <link rel="stylesheet" href="ProfileCard.css">

  <style>
    :root {
      /* Ritual Aesthetic Tokens - Default Dark */
      --bg-primary: #0a090c;
      --bg-secondary: #121015;
      --bg-panel: rgba(26, 22, 32, 0.85);
      --bg-etched: #050406;

      --ink-primary: #f0e9d8;
      --ink-secondary: #c9bfab;
      --ink-muted: #8a8375;

      --ritual-red: #d64d65;
      --ritual-pink: #eb94b3;
      --ritual-purple: #7d5c8a;

      --risk-amber: #e0b95d;
      --risk-shadow: #2a1f1f;

      --tech-muted: #6eb5b4;
      --tech-glow: rgba(110, 181, 180, 0.3);

      --metal-bronze: #8c6a45;
      --metal-copper: #a66b4a;

      --font-base: "Inter", system-ui, -apple-system, sans-serif;
      --font-ritual: "EB Garamond", serif;
      --font-mono: "JetBrains Mono", monospace;

      --font-line-height: 1.6;
      --radius-panel: 12px;
      --radius-chip: 4px;

      --glass-bg: rgba(26, 22, 32, 0.7);
      --glass-border: 1px solid rgba(240, 233, 216, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);

      --border-thin: 1px solid rgba(240, 233, 216, 0.1);
      --border-ritual: 1px solid rgba(214, 77, 101, 0.4);

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --bg-overlay: rgba(10, 9, 12, 0.4);
      --ink-overlay: #f0e9d8;

      --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    [data-theme="light"] {
      /* Contemplativo Aesthetic Tokens (Light) */
      --bg-primary: #fcf6f9;
      --bg-secondary: #f4e8f0;
      --bg-panel: rgba(255, 255, 255, 0.8);
      --bg-etched: #f0dfe8;

      --ink-primary: #2d2833;
      --ink-secondary: #5d5466;
      --ink-muted: #918499;

      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-border: 1px solid rgba(45, 40, 51, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);

      --border-thin: 1px solid rgba(45, 40, 51, 0.08);
      --border-ritual: 1px solid rgba(214, 77, 101, 0.15);

      --bg-overlay: rgba(255, 255, 255, 0.6);
      --ink-overlay: #2d2833;
    }

    [data-theme="sumi-e"] {
      /* Sumi-e Aesthetic Tokens (Ink Wash) */
      --bg-primary: #f2f2f0;
      --bg-secondary: #e8e8e6;
      --bg-panel: rgba(255, 255, 255, 0.6);
      --bg-etched: #dadada;

      --ink-primary: #1a1a1a;
      --ink-secondary: #4a4a4a;
      --ink-muted: #808080;

      --ritual-red: #8b0000;
      --ritual-pink: #c08081;
      --ritual-purple: #4a3a4a;

      --glass-bg: rgba(255, 255, 255, 0.3);
      --glass-border: 1px solid rgba(0, 0, 0, 0.1);
      --glass-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);

      --border-thin: 1px solid rgba(0, 0, 0, 0.06);
      --border-ritual: 2px solid rgba(0, 0, 0, 0.8);

      --bg-overlay: rgba(242, 242, 240, 0.8);
      --ink-overlay: #1a1a1a;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      color: var(--ink-primary);
      font-family: var(--font-base);
      transition: background var(--transition-slow);
    }

    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      padding-bottom: calc(var(--space-xl) * 4);
    }

    .main-content {
      width: 100%;
      max-width: clamp(320px, 92vw, 600px);
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
      z-index: 10;
      margin-top: var(--space-md);
    }

    /* Header Styling */
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-md);
      margin-bottom: var(--space-sm);
    }

    .app-logo {
      width: 88px;
      height: 88px;
      padding: 12px;
      box-sizing: border-box;
      object-fit: contain;
      border-radius: 50%;
      border: var(--border-thin);
      background: var(--bg-etched);
      box-shadow: var(--glass-shadow);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-10px) rotate(2deg);
      }
    }

    @keyframes revealIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    .brand-title {
      font-family: var(--font-ritual);
      margin: 0;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .sync-label {
      font-size: 0.75rem;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      line-height: 1.4;
      color: var(--ink-muted);
      font-weight: 500;
    }

    /* Card Area */
    .card-stage {
      display: flex;
      justify-content: center;
      perspective: 1000px;
      width: 100%;
    }

    .card-placeholder {
      width: 100%;
      max-width: clamp(320px, 92vw, 600px);
      min-height: clamp(360px, 60vh, 560px);
      background: var(--bg-panel);
      border: var(--border-thin);
      border-radius: var(--radius-panel);
      cursor: pointer;
      position: relative;
    }

    .reveal-overlay {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ritual);
      font-weight: 500;
      color: var(--ritual-pink);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 1rem;
      padding: var(--space-xl);
      text-align: center;
    }

    /* Floating Menu Styles */
    .floating-menu-container {
      position: fixed;
      bottom: var(--space-xl);
      right: var(--space-xl);
      z-index: 1000;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: var(--space-md);
      padding: 10px;
    }

    .menu-main-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--border-ritual);
      color: var(--ritual-red);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      transition: all var(--transition-base);
      z-index: 2;
    }

    .menu-main-btn:active {
      transform: scale(0.9);
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      pointer-events: none;
      transition: all var(--transition-slow);
    }

    .floating-menu-container.active .menu-options {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-opt-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: var(--border-thin);
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-bounce);
      position: relative;
      box-shadow: var(--glass-shadow);
    }

    .menu-opt-btn:hover {
      background: var(--bg-secondary);
      color: var(--ritual-pink);
      transform: scale(1.15) translateY(-5px);
      border-color: var(--ritual-pink);
    }

    .menu-main-btn:focus-visible,
    .menu-opt-btn:focus-visible,
    .btn-refresh:focus-visible,
    .close-btn:focus-visible {
      outline: 2px solid var(--ritual-pink);
      outline-offset: 2px;
    }

    .menu-opt-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .menu-opt-btn.is-fav {
      color: var(--ritual-red);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      color: var(--ink-overlay);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      padding: var(--space-xl);
      overflow-y: auto;
      transition: all var(--transition-slow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
      width: 100%;
      max-width: 900px;
      margin-inline: auto;
      border-bottom: var(--border-thin);
      padding-bottom: var(--space-md);
    }

    .modal-title {
      font-family: var(--font-ritual);
      font-size: 2.2rem;
      color: var(--ritual-pink);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .close-btn {
      background: var(--bg-panel);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: var(--border-thin);
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all var(--transition-base);
    }

    .close-btn:hover {
      color: var(--ritual-pink);
      border-color: var(--ritual-pink);
      transform: rotate(90deg);
    }

    .codex-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-xl);
      width: 100%;
      max-width: 1100px;
      margin-inline: auto;
      padding-bottom: calc(var(--space-xl) * 2);
    }

    .codex-item {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border: var(--border-thin);
      border-radius: var(--radius-panel);
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      transition: all var(--transition-base);
      box-shadow: var(--glass-shadow);
    }

    .codex-item:hover {
      transform: translateY(-5px);
      border-color: var(--ritual-pink);
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.6);
    }

    .codex-item-frase {
      font-family: var(--font-ritual);
      font-size: 1.1rem;
      font-style: italic;
    }

    .codex-item-cat {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--ritual-pink);
      letter-spacing: 0.1em;
    }

    /* Common */
    .btn-refresh {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: var(--border-thin);
      color: var(--ink-secondary);
      padding: 14px 32px;
      border-radius: var(--radius-panel);
      font-size: 0.9rem;
      font-family: var(--font-ritual);
      cursor: pointer;
      margin-top: var(--space-xl);
      transition: all var(--transition-bounce);
      width: fit-content;
      align-self: center;
      letter-spacing: 0.08em;
      box-shadow: var(--glass-shadow);
    }

    .btn-refresh:hover {
      color: var(--ritual-pink);
      border-color: var(--ritual-pink);
      transform: scale(1.05);
      background: var(--bg-secondary);
    }

    /* Buy Me a Coffee Button */
    .bmc-btn {
      position: fixed;
      bottom: var(--space-xl);
      left: var(--space-xl);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: #FFDD00;
      color: #000000;
      border-radius: 50px;
      font-family: var(--font-base);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all var(--transition-bounce);
      font-size: 0.85rem;
    }

    .bmc-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    /* Donation Reminder */
    .donation-reminder {
      position: fixed;
      top: var(--space-xl);
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: var(--border-thin);
      padding: 12px 24px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: var(--glass-shadow);
      z-index: 3000;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .donation-reminder.active {
      transform: translateX(-50%) translateY(0);
    }

    .donation-reminder p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ink-primary);
      font-family: var(--font-base);
    }

    .donation-close {
      cursor: pointer;
      color: var(--ink-muted);
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .donation-close:hover {
      color: var(--ritual-red);
    }

    /* Sumi-e specific overrides */
    [data-theme="sumi-e"] .pc-card {
      border: none;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      background: url('https://www.transparenttextures.com/patterns/papyrus-dark.png'), #fff;
    }

    [data-theme="sumi-e"] .pc-inside {
      border: 3px solid #1a1a1a;
      margin: 12px;
      padding: 30px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.4);
    }

    [data-theme="sumi-e"] .pc-frase {
      font-weight: 700;
      color: #000;
    }

    [data-theme="sumi-e"] .pc-wisdom-category {
      color: #8b0000;
      letter-spacing: 0.4em;
    }

    [data-theme="sumi-e"] .brand-title {
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #1a1a1a;
      text-shadow: none;
    }

    .btn-refresh:active {
      transform: scale(0.95);
    }

    .loading {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      color: var(--ritual-pink);
      font-family: var(--font-ritual);
      font-size: 1.5rem;
    }

    .info-content {
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.8;
      color: var(--ink-overlay);
      font-family: var(--font-base);
    }

    .info-content h3 {
      font-family: var(--font-ritual);
      color: var(--ink-primary);
      margin-top: var(--space-lg);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Dataset -->
  <script src="dataset_qi.js?v=2.0.0"></script>

  <!-- React & Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react",
        "react-dom/client": "https://esm.sh/react-dom/client",
        "ogl": "https://esm.sh/ogl"
      }
    }
  </script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Renderer, Program, Mesh, Color, Triangle } from 'ogl';

    /* --- GALAXY COMPONENT --- */
    const vertexShader = `
attribute vec2 uv;
attribute vec2 position;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0, 1);
}`;
    const fragmentShader = `
precision highp float;
uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;
varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) { return abs(fract(x) * 2.0 - 1.0); }
float tris(float x) { float t = fract(x); return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0)); }
float trisn(float x) { float t = fract(x); return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0; }
vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);
  vec2 gv = fract(uv) - 0.5;
  vec2 id = floor(uv);
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;
      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));
      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;
      float star = Star(gv - offset - pad, flareSize);
      vec3 color = base;
      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      col += star * size * color;
    }
  }
  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;
  vec2 mouseNorm = uMouse - vec2(0.5);
  if (uAutoCenterRepulsion > 0.0) {
    vec2 centerUV = vec2(0.0, 0.0);
    float centerDist = length(uv - centerUV);
    vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
    uv += repulsion * 0.05;
  } else if (uMouseRepulsion) {
    vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
    float mouseDist = length(uv - mousePosUV);

              </button>
              <button className="menu-opt-btn" onClick={() => setShowCodex(true)} title="Codex" aria-label="Abrir codex">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16.5a2.5 2.5 0 0 0-2.5-2.5H6.5A2.5 2.5 0 0 0 4 19.5z" /></svg>
              </button>
              <button className="menu-opt-btn" onClick={() => setShowInfo(true)} title="Info" aria-label="Ver información">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></svg>
              </button>
            </div>
          </div>

          {/* Codex Modal */}
          {showCodex && (
            <div className="modal-overlay">
              <header className="modal-header">
                <h2 className="modal-title">El Codex</h2>
                <button className="close-btn" onClick={() => setShowCodex(false)}>&times;</button>
              </header>
              <div className="codex-list">
                {favorites.length === 0 ? (
                  <p style={{ textAlign: 'center', gridColumn: '1/-1', opacity: 0.7, color: 'var(--ink-overlay)' }}>No has guardado sabiduría aún.</p>
                ) : (
                  favorites.map(f => (
                    <div key={f.id} className="codex-item" onClick={() => { setCard(f); setShowCodex(false); setIsRevealed(true); }}>
                      <span className="codex-item-cat">{f.categoria}</span>
                      <p className="codex-item-frase">"{f.frase}"</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* Info Modal */}
          {showInfo && (
            <div className="modal-overlay">
              <header className="modal-header">
                <h2 className="modal-title">Protocolo Erudito</h2>
                <button className="close-btn" onClick={() => setShowInfo(false)}>&times;</button>
              </header>
              <div className="info-content">
                <h3>Sobre el Conocimiento</h3>
                <p>El conocimiento interior no es neutral. A veces se explora como un paisaje. A veces se escucha como un ritual. En ambos casos, tiene consecuencias.</p>
                <h3>Créditos</h3>
                <p>Diseño y Concepto: Cosmología Visual de la Reflexión.</p>
                <p>Desarrollado para la contemplación diaria.</p>
                <div style={{ marginTop: '40px', textAlign: 'center', opacity: 0.3, fontSize: '0.8rem' }}>Trozos de Sabiduría v1.1.0</div>
              </div>
            </div>
          )}

          {/* Buy Me a Coffee */}
          <a href="https://buymeacoffee.com/herramente" target="_blank" rel="noopener noreferrer" className="bmc-btn">
            <img src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg" alt="Buy me a coffee" />
            <span>Apoyar Herramente</span>
          </a>

          {/* Donation Reminder */}
          <div className={`donation-reminder ${donationVisible ? 'active' : ''}`}>
            <p>¿Te gusta esta sabiduría? Considera donar para mantener el servidor vivo.</p>
            <a href="https://buymeacoffee.com/herramente" target="_blank" rel="noopener noreferrer" style={{ color: 'var(--ritual-red)', fontWeight: 'bold', textDecoration: 'none' }}>Donar</a>
            <span className="donation-close" onClick={() => setDonationVisible(false)}>&times;</span>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW registration failed", err));
      });
    }
  </script>
</body>

</html>
