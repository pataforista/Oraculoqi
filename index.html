<!DOCTYPE html>
<html lang="es">

<head>

  <title>Trozos de Sabiduría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta name="theme-color" content="#050608">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="Galaxy.css">
  <link rel="stylesheet" href="ElectricBorder.css">
  <link rel="stylesheet" href="ProfileCard.css">

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background: #050608;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      color: white;
      font-family: 'Noto Serif', serif;
    }

    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 60px;
    }

    .main-content {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      z-index: 10;
      margin-top: 20px;
    }

    /* Header Styling */
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .app-logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .brand-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sync-label {
      font-size: 0.75rem;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: -10px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .action-btn.is-fav {
      color: #c5a059;
      border-color: rgba(197, 160, 89, 0.3);
      background: rgba(197, 160, 89, 0.1);
    }

    /* Reveal Area */
    .card-stage {
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .card-placeholder {
      aspect-ratio: 3 / 4;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }

    .reveal-overlay {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #c5a059;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.9rem;
    }

    /* Refresh Button */
    .btn-refresh {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
      width: fit-content;
      align-self: center;
    }

    .btn-refresh:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .loading {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #c5a059;
    }
  </style>
</head>

    /* --- MAIN APP COMPONENT --- */
    function App() {
      const [card, setCard] = useState(null);
      const [isRevealed, setIsRevealed] = useState(false);
      const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('trozos_sabiduria_favorites') || '[]'));

      useEffect(() => {
        if (window.QI_DATASET_V1) {
          const deck = window.QI_DATASET_V1.cards, today = new Date().toISOString().split('T')[0];
          let hash = 0; for (let i = 0; i < today.length; i++) hash = ((hash << 5) - hash) + today.charCodeAt(i);
          setCard(deck[Math.abs(hash | 0) % deck.length]);
        }
      }, []);

      useEffect(() => { localStorage.setItem('trozos_sabiduria_favorites', JSON.stringify(favorites)); }, [favorites]);

      const toggleFavorite = useCallback(() => {
        if (!card) return;
        setFavorites(f => f.find(x => x.id === card.id) ? f.filter(x => x.id !== card.id) : [...f, card]);
      }, [card]);

      const shareCard = useCallback(async () => {
        if (!card) return;
        const data = { title: 'Trozos de Sabiduría', text: `"${card.frase}"\n\n- Trozos de Sabiduría`, url: window.location.href };
        try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(`${data.text}\n${data.url}`); alert('Copiado al portapapeles'); } } catch (e) { console.error(e); }
      }, [card]);

      if (!card) return <div className="loading">Cargando sabiduría...</div>;
      const isFav = favorites.some(f => f.id === card.id);

      return (
        <div className="app-container">
          <Galaxy speed={0.4} density={1.2} hueShift={140} twinkleIntensity={0.4} />

          <main className="main-content">
            <header className="app-header">
              <img src="logo_cacb.jpeg" className="app-logo" alt="Logo" />
              <div className="brand-info">
                <h1 className="brand-title">Trozos de Sabiduría</h1>
                <p className="sync-label">Sincronía · {new Date().toLocaleDateString()}</p>
              </div>
            </header>

            <div className="card-stage">
              {!isRevealed ? (
                <div className="card-placeholder" onClick={() => setIsRevealed(true)}>
                  <ElectricBorder color="#c5a059" speed={0.6} chaos={0.08}>
                    <div className="reveal-overlay"><span>Revelar Sabiduría</span></div>
                  </ElectricBorder>
                </div>
              ) : (
                <div className="revealed-content" style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: '40px' }}>
                  <WisdomCard card={card} />

                  <div className="actions-bar">
                    <button className={`action-btn ${isFav ? 'is-fav' : ''}`} onClick={toggleFavorite} title="Favorito">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill={isFav ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
                    </button>
                    <button className="action-btn" onClick={shareCard} title="Compartir">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" /></svg>
                    </button>
                  </div>

                  <button className="btn-refresh" onClick={() => window.location.reload()}>Otra sincronía para hoy</button>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW registration failed", err));
      });
    }
  </script>
</body>

</html>
