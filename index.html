<body>
  <div id="root"></div>

  <!-- Dataset -->
  <script src="dataset_qi_v1.js?v=1.1.0"></script>

  <!-- React & Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react",
        "react-dom/client": "https://esm.sh/react-dom/client",
        "ogl": "https://esm.sh/ogl"
      }
    }
  </script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Renderer, Program, Mesh, Color, Triangle } from 'ogl';

    /* --- GALAXY COMPONENT --- */
    const vertexShader = `
attribute vec2 uv;
attribute vec2 position;

varying vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 0, 1);
}
`;

    const fragmentShader = `
precision highp float;

uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;

varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) {
  return abs(fract(x) * 2.0 - 1.0);
}

float tris(float x) {
  float t = fract(x);
  return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
}

float trisn(float x) {
  float t = fract(x);
  return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);

  vec2 gv = fract(uv) - 0.5; 
  vec2 id = floor(uv);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));

      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

      float star = Star(gv - offset - pad, flareSize);
      vec3 color = base;

      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      
      col += star * size * color;
    }
  }

  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

  vec2 mouseNorm = uMouse - vec2(0.5);
  
  if (uAutoCenterRepulsion > 0.0) {
    vec2 centerUV = vec2(0.0, 0.0);
    float centerDist = length(uv - centerUV);
    vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
    uv += repulsion * 0.05;
  } else if (uMouseRepulsion) {
    vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
    float mouseDist = length(uv - mousePosUV);
    vec2 repulsion = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1));
    uv += repulsion * 0.05 * uMouseActiveFactor;
  } else {
    vec2 mouseOffset = mouseNorm * 0.1 * uMouseActiveFactor;
    uv += mouseOffset;
  }

  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;

  uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

  vec3 col = vec3(0.0);

  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }

  if (uTransparent) {
    float alpha = length(col);
    alpha = smoothstep(0.0, 0.3, alpha);
    alpha = min(alpha, 1.0);
    gl_FragColor = vec4(col, alpha);
  } else {
    gl_FragColor = vec4(col, 1.0);
  }
}
`;

    function Galaxy({
      focal = [0.5, 0.5],
      rotation = [1.0, 0.0],
      starSpeed = 0.5,
      density = 1,
      hueShift = 140,
      disableAnimation = false,
      speed = 1.0,
      mouseInteraction = true,
      glowIntensity = 0.3,
      saturation = 0.0,
      mouseRepulsion = true,
      repulsionStrength = 2,
      twinkleIntensity = 0.3,
      rotationSpeed = 0.1,
      autoCenterRepulsion = 0,
      transparent = true,
      ...rest
    }) {
      const ctnDom = useRef(null);
      const targetMousePos = useRef({ x: 0.5, y: 0.5 });
      const smoothMousePos = useRef({ x: 0.5, y: 0.5 });
      const targetMouseActive = useRef(0.0);
      const smoothMouseActive = useRef(0.0);

      useEffect(() => {
        if (!ctnDom.current) return;
        const ctn = ctnDom.current;
        const renderer = new Renderer({
          alpha: transparent,
          premultipliedAlpha: false
        });
        const gl = renderer.gl;

        if (transparent) {
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.clearColor(0, 0, 0, 0);
        } else {
          gl.clearColor(0, 0, 0, 1);
        }

        let program;

        function resize() {
          const scale = 1;
          renderer.setSize(ctn.offsetWidth * scale, ctn.offsetHeight * scale);
          if (program) {
            program.uniforms.uResolution.value = new Color(
              gl.canvas.width,
              gl.canvas.height,
              gl.canvas.width / gl.canvas.height
            );
          }
        }
        window.addEventListener('resize', resize, false);
        resize();

        const geometry = new Triangle(gl);
        program = new Program(gl, {
          vertex: vertexShader,
          fragment: fragmentShader,
          uniforms: {
            uTime: { value: 0 },
            uResolution: {
              value: new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height)
            },
            uFocal: { value: new Float32Array(focal) },
            uRotation: { value: new Float32Array(rotation) },
            uStarSpeed: { value: starSpeed },
            uDensity: { value: density },
            uHueShift: { value: hueShift },
            uSpeed: { value: speed },
            uMouse: {
              value: new Float32Array([smoothMousePos.current.x, smoothMousePos.current.y])
            },
            uGlowIntensity: { value: glowIntensity },
            uSaturation: { value: saturation },
            uMouseRepulsion: { value: mouseRepulsion },
            uTwinkleIntensity: { value: twinkleIntensity },
            uRotationSpeed: { value: rotationSpeed },
            uRepulsionStrength: { value: repulsionStrength },
            uMouseActiveFactor: { value: 0.0 },
            uAutoCenterRepulsion: { value: autoCenterRepulsion },
            uTransparent: { value: transparent }
          }
        });

        const mesh = new Mesh(gl, { geometry, program });
        let animateId;

        function update(t) {
          animateId = requestAnimationFrame(update);
          if (!disableAnimation) {
            program.uniforms.uTime.value = t * 0.001;
            program.uniforms.uStarSpeed.value = (t * 0.001 * starSpeed) / 10.0;
          }

          const lerpFactor = 0.05;
          smoothMousePos.current.x += (targetMousePos.current.x - smoothMousePos.current.x) * lerpFactor;
          smoothMousePos.current.y += (targetMousePos.current.y - smoothMousePos.current.y) * lerpFactor;

          smoothMouseActive.current += (targetMouseActive.current - smoothMouseActive.current) * lerpFactor;

          program.uniforms.uMouse.value[0] = smoothMousePos.current.x;
          program.uniforms.uMouse.value[1] = smoothMousePos.current.y;
          program.uniforms.uMouseActiveFactor.value = smoothMouseActive.current;

          renderer.render({ scene: mesh });
        }
        animateId = requestAnimationFrame(update);
        ctn.appendChild(gl.canvas);

        function handleMouseMove(e) {
          const rect = ctn.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = 1.0 - (e.clientY - rect.top) / rect.height;
          targetMousePos.current = { x, y };
          targetMouseActive.current = 1.0;
        }

        function handleMouseLeave() {
          targetMouseActive.current = 0.0;
        }

        if (mouseInteraction) {
          ctn.addEventListener('mousemove', handleMouseMove);
          ctn.addEventListener('mouseleave', handleMouseLeave);
        }

        return () => {
          cancelAnimationFrame(animateId);
          window.removeEventListener('resize', resize);
          if (mouseInteraction) {
            ctn.removeEventListener('mousemove', handleMouseMove);
            ctn.removeEventListener('mouseleave', handleMouseLeave);
          }
          ctn.removeChild(gl.canvas);
          gl.getExtension('WEBGL_lose_context')?.loseContext();
        };
      }, [
        focal,
        rotation,
        starSpeed,
        density,
        hueShift,
        disableAnimation,
        speed,
        mouseInteraction,
        glowIntensity,
        saturation,
        mouseRepulsion,
        twinkleIntensity,
        rotationSpeed,
        repulsionStrength,
        autoCenterRepulsion,
        transparent
      ]);

      return <div ref={ctnDom} className="galaxy-container" {...rest} />;
    }

    /* --- ELECTRIC BORDER COMPONENT --- */
    const ElectricBorder = ({
      children,
      color = '#c5a059',
      speed = 1,
      chaos = 0.12,
      borderRadius = 24,
      className,
      style
    }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const animationRef = useRef(null);
      const timeRef = useRef(0);
      const lastFrameTimeRef = useRef(0);

      const random = useCallback(x => (Math.sin(x * 12.9898) * 43758.5453) % 1, []);
      const noise2D = useCallback((x, y) => {
        const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
        const a = random(i + j * 57), b = random(i + 1 + j * 57), c = random(i + (j + 1) * 57), d = random(i + 1 + (j + 1) * 57);
        const ux = fx * fx * (3.0 - 2.0 * fx), uy = fy * fy * (3.0 - 2.0 * fy);
        return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
      }, [random]);
      const octavedNoise = useCallback((x, octaves, lacunarity, gain, baseAmplitude, baseFrequency, time, seed, baseFlatness) => {
        let y = 0, amplitude = baseAmplitude, frequency = baseFrequency;
        for (let i = 0; i < octaves; i++) {
          let octaveAmplitude = amplitude;
          if (i === 0) octaveAmplitude *= baseFlatness;
          y += octaveAmplitude * noise2D(frequency * x + seed * 100, time * frequency * 0.3);
          frequency *= lacunarity;
          amplitude *= gain;
        }
        return y;
      }, [noise2D]);
      const getCornerPoint = useCallback((centerX, centerY, radius, startAngle, arcLength, progress) => {
        const angle = startAngle + progress * arcLength;
        return { x: centerX + radius * Math.cos(angle), y: centerY + radius * Math.sin(angle) };
      }, []);
      const getRoundedRectPoint = useCallback((t, left, top, width, height, radius) => {
        const straightWidth = width - 2 * radius, straightHeight = height - 2 * radius, cornerArc = (Math.PI * radius) / 2;
        const totalPerimeter = 2 * straightWidth + 2 * straightHeight + 4 * cornerArc, distance = t * totalPerimeter;
        let acc = 0;
        if (distance <= acc + straightWidth) return { x: left + radius + ((distance - acc) / straightWidth) * straightWidth, y: top };
        acc += straightWidth;
        if (distance <= acc + cornerArc) return getCornerPoint(left + width - radius, top + radius, radius, -Math.PI / 2, Math.PI / 2, (distance - acc) / cornerArc);
        acc += cornerArc;
        if (distance <= acc + straightHeight) return { x: left + width, y: top + radius + ((distance - acc) / straightHeight) * straightHeight };
        acc += straightHeight;
        if (distance <= acc + cornerArc) return getCornerPoint(left + width - radius, top + height - radius, radius, 0, Math.PI / 2, (distance - acc) / cornerArc);
        acc += cornerArc;
        if (distance <= acc + straightWidth) return { x: left + width - radius - ((distance - acc) / straightWidth) * straightWidth, y: top + height };
        acc += straightWidth;
        if (distance <= acc + cornerArc) return getCornerPoint(left + radius, top + height - radius, radius, Math.PI / 2, Math.PI / 2, (distance - acc) / cornerArc);
        acc += cornerArc;
        if (distance <= acc + straightHeight) return { x: left, y: top + height - radius - ((distance - acc) / straightHeight) * straightHeight };
        acc += straightHeight;
        return getCornerPoint(left + radius, top + radius, radius, Math.PI, Math.PI / 2, (distance - acc) / cornerArc);
      }, [getCornerPoint]);

      useEffect(() => {
        const canvas = canvasRef.current, container = containerRef.current;
        if (!canvas || !container) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const octaves = 10, lacunarity = 1.6, gain = 0.7, amplitude = chaos, frequency = 10, baseFlatness = 0, displacement = 60, borderOffset = 60;
        const updateSize = () => {
          const rect = container.getBoundingClientRect(), width = rect.width + borderOffset * 2, height = rect.height + borderOffset * 2, dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = `${width}px`; canvas.style.height = `${height}px`; ctx.scale(dpr, dpr);
          return { width, height };
        };
        let { width, height } = updateSize();
        const draw = currentTime => {
          const deltaTime = (currentTime - lastFrameTimeRef.current) / 1000;
          timeRef.current += deltaTime * speed;
          lastFrameTimeRef.current = currentTime;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.scale(dpr, dpr);
          ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          const scale = displacement, left = borderOffset, top = borderOffset, borderWidth = width - 2 * borderOffset, borderHeight = height - 2 * borderOffset, radius = Math.min(borderRadius, Math.min(borderWidth, borderHeight) / 2);
          const approximatePerimeter = 2 * (borderWidth + borderHeight) + 2 * Math.PI * radius, sampleCount = Math.floor(approximatePerimeter / 2);
          ctx.beginPath();
          for (let i = 0; i <= sampleCount; i++) {
            const p = i / sampleCount, point = getRoundedRectPoint(p, left, top, borderWidth, borderHeight, radius);
            const xN = octavedNoise(p * 8, octaves, lacunarity, gain, amplitude, frequency, timeRef.current, 0, baseFlatness);
            const yN = octavedNoise(p * 8, octaves, lacunarity, gain, amplitude, frequency, timeRef.current, 1, baseFlatness);
            if (i === 0) ctx.moveTo(point.x + xN * scale, point.y + yN * scale);
            else ctx.lineTo(point.x + xN * scale, point.y + yN * scale);
          }
          ctx.closePath(); ctx.stroke();
          animationRef.current = requestAnimationFrame(draw);
        };
        const resizeObserver = new ResizeObserver(() => { const sz = updateSize(); width = sz.width; height = sz.height; });
        resizeObserver.observe(container);
        animationRef.current = requestAnimationFrame(draw);
        return () => { cancelAnimationFrame(animationRef.current); resizeObserver.disconnect(); };
      }, [color, speed, chaos, borderRadius, octavedNoise, getRoundedRectPoint]);

      return (
        <div ref={containerRef} className={`electric-border ${className ?? ''}`} style={{ '--electric-border-color': color, borderRadius, ...style }}>
          <div className="eb-canvas-container"><canvas ref={canvasRef} className="eb-canvas" /></div>
          <div className="eb-layers"><div className="eb-glow-1" /><div className="eb-glow-2" /><div className="eb-background-glow" /></div>
          <div className="eb-content">{children}</div>
        </div>
      );
    };

    /* --- PROFILE CARD COMPONENT --- */
    const ProfileCard = React.memo(({
      avatarUrl = '', iconUrl = '', grainUrl = '', innerGradient, behindGlowEnabled = true, behindGlowColor, behindGlowSize, className = '',
      enableTilt = true, mobileTiltSensitivity = 5, name = 'Sabiduría', title = '', handle = 'sabiduria', status = 'Online', contactText = 'Ver más',
      showUserInfo = true, onContactClick, isFavorite = false, onFavoriteToggle, onShareClick, children
    }) => {
      const wrapRef = useRef(null), shellRef = useRef(null), enterTimerRef = useRef(null), leaveRafRef = useRef(null);
      const tiltEngine = useMemo(() => {
        if (!enableTilt) return null;
        let rafId = null, running = false, lastTs = 0, currentX = 0, currentY = 0, targetX = 0, targetY = 0, initialUntil = 0;
        const step = ts => {
          if (!running) return;
          if (lastTs === 0) lastTs = ts;
          const dt = (ts - lastTs) / 1000; lastTs = ts;
          const tau = ts < initialUntil ? 0.6 : 0.14, k = 1 - Math.exp(-dt / tau);
          currentX += (targetX - currentX) * k; currentY += (targetY - currentY) * k;
          const shell = shellRef.current, wrap = wrapRef.current;
          if (shell && wrap) {
            const w = shell.clientWidth || 1, h = shell.clientHeight || 1, px = clamp((100 / w) * currentX), py = clamp((100 / h) * currentY), cx = px - 50, cy = py - 50;
            const props = { '--pointer-x': `${px}%`, '--pointer-y': `${py}%`, '--background-x': `${adjust(px, 0, 100, 35, 65)}%`, '--background-y': `${adjust(py, 0, 100, 35, 65)}%`, '--pointer-from-center': `${clamp(Math.hypot(cy, cx) / 50, 0, 1)}`, '--pointer-from-top': `${py / 100}`, '--pointer-from-left': `${px / 100}`, '--rotate-x': `${round(-(cx / 5))}deg`, '--rotate-y': `${round(cy / 4)}deg` };
            for (const [k, v] of Object.entries(props)) wrap.style.setProperty(k, v);
          }
          if (Math.abs(targetX - currentX) > 0.05 || Math.abs(targetY - currentY) > 0.05 || document.hasFocus()) rafId = requestAnimationFrame(step);
          else { running = false; lastTs = 0; }
        };
        const start = () => { if (!running) { running = true; lastTs = 0; rafId = requestAnimationFrame(step); } };
        return { setImmediate(x, y) { currentX = x; currentY = y; }, setTarget(x, y) { targetX = x; targetY = y; start(); }, toCenter() { const s = shellRef.current; if (s) this.setTarget(s.clientWidth / 2, s.clientHeight / 2); }, beginInitial(ms) { initialUntil = performance.now() + ms; start(); }, getCurrent() { return { x: currentX, y: currentY, tx: targetX, ty: targetY }; }, cancel() { if (rafId) cancelAnimationFrame(rafId); running = false; } };
      }, [enableTilt]);

      useEffect(() => {
        if (!enableTilt || !tiltEngine) return;
        const shell = shellRef.current; if (!shell) return;
        const onEnter = e => { shell.classList.add('active', 'entering'); if (enterTimerRef.current) clearTimeout(enterTimerRef.current); enterTimerRef.current = setTimeout(() => shell.classList.remove('entering'), 180); const r = shell.getBoundingClientRect(); tiltEngine.setTarget(e.clientX - r.left, e.clientY - r.top); };
        const onMove = e => { const r = shell.getBoundingClientRect(); tiltEngine.setTarget(e.clientX - r.left, e.clientY - r.top); };
        const onLeave = () => {
          tiltEngine.toCenter();
          const check = () => { const { x, y, tx, ty } = tiltEngine.getCurrent(); if (Math.hypot(tx - x, ty - y) < 0.6) { shell.classList.remove('active'); leaveRafRef.current = null; } else leaveRafRef.current = requestAnimationFrame(check); };
          if (leaveRafRef.current) cancelAnimationFrame(leaveRafRef.current); leaveRafRef.current = requestAnimationFrame(check);
        };
        shell.addEventListener('pointerenter', onEnter); shell.addEventListener('pointermove', onMove); shell.addEventListener('pointerleave', onLeave);
        const initialX = (shell.clientWidth || 0) - 70, initialY = 60;
        tiltEngine.setImmediate(initialX, initialY); tiltEngine.toCenter(); tiltEngine.beginInitial(1200);
        return () => { shell.removeEventListener('pointerenter', onEnter); shell.removeEventListener('pointermove', onMove); shell.removeEventListener('pointerleave', onLeave); tiltEngine.cancel(); };
      }, [enableTilt, tiltEngine]);

      const style = { '--inner-gradient': innerGradient ?? 'linear-gradient(145deg,#60496e8c 0%,#71C4FF44 100%)', '--behind-glow-color': behindGlowColor ?? 'rgba(125, 190, 255, 0.67)', '--behind-glow-size': behindGlowSize ?? '50%' };
      return (
        <div ref={wrapRef} className={`pc-card-wrapper ${className}`.trim()} style={style}>
          {behindGlowEnabled && <div className="pc-behind" />}
          <button className="pc-share-btn" onClick={onShareClick} title="Compartir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" /></svg></button>
          <button className="pc-favorite-btn" onClick={onFavoriteToggle} title="Favoritos"><svg width="22" height="22" viewBox="0 0 24 24" fill={isFavorite ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.84-8.84 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg></button>
          <div ref={shellRef} className="pc-card-shell">
            <section className="pc-card"><div className="pc-inside"><div className="pc-shine" /><div className="pc-glare" />
              <div className="pc-avatar-content"><img className="avatar" src={avatarUrl} alt="Avatar" />
                {showUserInfo && <div className="pc-user-info"><div className="pc-user-details"><div className="pc-mini-avatar"><img src={avatarUrl} alt="Mini" /></div><div className="pc-user-text"><div className="pc-handle">@{handle}</div><div className="pc-status">{status}</div></div></div><button className="pc-contact-btn" onClick={onContactClick}>{contactText}</button></div>}
              </div>
              <div className="pc-content"><div className="pc-details"><h3>{name}</h3><p>{title}</p></div>{children}</div>
            </div></section>
          </div>
        </div>
      );
    });

    const clamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
    const round = (v, pr = 3) => parseFloat(v.toFixed(pr));
    const adjust = (v, f1, f2, t1, t2) => round(t1 + ((t2 - t1) * (v - f1)) / (f2 - f1));

    /* --- MAIN APP COMPONENT --- */
    function App() {
      const [card, setCard] = useState(null);
      const [isRevealed, setIsRevealed] = useState(false);
      const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('trozos_sabiduria_favorites') || '[]'));

      useEffect(() => {
        if (window.QI_DATASET_V1) {
          const deck = window.QI_DATASET_V1.cards, today = new Date().toISOString().split('T')[0];
          let hash = 0; for (let i = 0; i < today.length; i++) hash = ((hash << 5) - hash) + today.charCodeAt(i);
          setCard(deck[Math.abs(hash | 0) % deck.length]);
        }
      }, []);

      useEffect(() => { localStorage.setItem('trozos_sabiduria_favorites', JSON.stringify(favorites)); }, [favorites]);

      const toggleFavorite = useCallback(() => {
        if (!card) return;
        setFavorites(f => f.find(x => x.id === card.id) ? f.filter(x => x.id !== card.id) : [...f, card]);
      }, [card]);

      const shareCard = useCallback(async () => {
        if (!card) return;
        const data = { title: 'Trozos de Sabiduría', text: `"${card.frase}"\n\n- Trozos de Sabiduría`, url: window.location.href };
        try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(`${data.text}\n${data.url}`); alert('Copiado al portapapeles'); } } catch (e) { console.error(e); }
      }, [card]);

      if (!card) return <div className="loading">Cargando sabiduría...</div>;
      const isFav = favorites.some(f => f.id === card.id);

      return (
        <div className="app-container">
          <Galaxy speed={0.5} density={1.5} hueShift={140} twinkleIntensity={0.5} />
          <main className="main-content">
            <header className="brand-header"><img src="logo_cacb.jpeg" className="brand-logo" alt="Logo" /><div className="brand-info"><h1>Trozos de Sabiduría</h1><p className="date-sync">Sincronía · {new Date().toLocaleDateString()}</p></div></header>
            <div className="card-stage"><div className={`card-anim-container ${isRevealed ? 'is-revealed' : ''}`}>
              {!isRevealed ? (
                <div className="card-placeholder" onClick={() => setIsRevealed(true)}><ElectricBorder color="#c5a059" speed={0.8}><div className="reveal-overlay"><span>Revelar vía</span></div></ElectricBorder></div>
              ) : (
                <ProfileCard name="Trozos de Sabiduría" title={card.categoria.replace('_', ' ')} handle="sabiduria" status="Presente" contactText="Ver más" avatarUrl="logo_cacb.jpeg" isFavorite={isFav} onFavoriteToggle={toggleFavorite} onShareClick={shareCard} showUserInfo={true}>
                  <div className="pc-text-container"><p className="card-frase">“{card.frase}”</p><p className="card-interpretacion">{card.interpretacion}</p><div className="card-practica"><label>Invitación hoy</label><p>{card.practica_hoy}</p></div></div>
                </ProfileCard>
              )}
            </div></div>
            {isRevealed && <button className="btn-another" onClick={() => window.location.reload()}>Otra sincronía</button>}
          </main>
          <style>{`
            .app-container { min-height: 100vh; color: white; font-family: 'Noto Serif', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden; }
            .main-content { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 40px; z-index: 10; }
            .brand-header { display: flex; align-items: center; gap: 15px; padding-top: 20px; }
            .brand-logo { width: 48px; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
            .brand-info h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
            .date-sync { font-size: 0.75rem; opacity: 0.6; margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.05em; }
            .card-stage { display: flex; justify-content: center; perspective: 1000px; }
            .card-anim-container { width: 100%; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
            .card-placeholder { aspect-ratio: 3 / 5.2; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 24px; cursor: pointer; height: 100%; width: 100%; }
            .reveal-overlay { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #c5a059; text-transform: uppercase; letter-spacing: 0.1em; }
            .pc-text-container { flex: 1; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; min-height: 0; }
            .pc-text-container::-webkit-scrollbar { display: none; }
            .card-frase { font-size: 1.3rem; font-weight: 500; line-height: 1.4; margin: 0; }
            .card-interpretacion { font-size: 0.95rem; opacity: 0.8; line-height: 1.6; margin: 0; }
            .card-practica { background: rgba(197,160,89,0.1); padding: 15px; border-radius: 16px; border: 1px solid rgba(197,160,89,0.2); }
            .card-practica label { display: block; font-size: 0.7rem; text-transform: uppercase; color: #c5a059; font-weight: 700; margin-bottom: 5px; }
            .card-practica p { font-size: 0.85rem; margin: 0; line-height: 1.5; }
            .btn-another { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
            .btn-another:hover { background: rgba(255,255,255,0.1); }
            .loading { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #c5a059; }
          `}</style>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW registration failed", err));
      });
    }
  </script>
</body>

</html>
